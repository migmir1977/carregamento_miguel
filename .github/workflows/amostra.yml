# TEMPORÁRIO: guarda uma amostra do feed DATEX II (postos Continente e outros) para análise.
# Vai ser removido depois de concluída a integração do Continente.
name: Amostra do feed (temporário)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Extrair amostra
        run: |
          python - <<'EOF'
          import collections, os, tempfile, requests, xml.etree.ElementTree as ET
          url = "https://pgm.mobie.pt/integration/nap/evChargingInfra"
          fd, path = tempfile.mkstemp(suffix=".xml"); os.close(fd)
          with requests.get(url, stream=True, timeout=600) as r:
              r.raise_for_status()
              with open(path, "wb") as f:
                  for ch in r.iter_content(1 << 20): f.write(ch)
          loc = lambda t: t.rsplit("}", 1)[-1]
          want = {"CNT-0002PL0007", "CNT-0002PR0001", "CNT-0004PL0001", "CNT-0004PR0001"}
          out, n_cnt, other, tags = [], 0, 0, collections.Counter()
          ctx = ET.iterparse(path, events=("start", "end")); _, root = next(ctx)
          header_done = False
          for ev, el in ctx:
              if ev != "end" or loc(el.tag) != "energyInfrastructureSite":
                  continue
              sid = el.get("id") or ""
              if sid.startswith("CNT-"):
                  for sub in el.iter(): tags[loc(sub.tag)] += 1
                  if n_cnt < 4 or sid in want:
                      out.append(ET.tostring(el, encoding="unicode")); n_cnt += 1
              elif other < 1 and sid.startswith("EDP-"):
                  out.append(ET.tostring(el, encoding="unicode")); other += 1
              el.clear(); root.clear()
          os.makedirs("data/amostra", exist_ok=True)
          with open("data/amostra/feed_amostra.xml", "w", encoding="utf-8") as f:
              f.write("<amostra>\n" + "\n".join(out) + "\n</amostra>\n")
          with open("data/amostra/tags_cnt.txt", "w", encoding="utf-8") as f:
              for t, n in sorted(tags.items()): f.write(f"{t}\t{n}\n")
          print(len(out), "sites na amostra")
          EOF
      - name: Guardar amostra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/amostra
          git commit -m "Amostra temporária do feed DATEX II" && git push
