# TEMPORÁRIO: inspeciona os ficheiros de dados de data.mobie.pt (só escreve no registo).
name: Procurar link de tarifas (temporário)

on:
  workflow_dispatch:

jobs:
  procurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspecionar
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          UA = {"User-Agent": "Mozilla/5.0", "Accept-Encoding": "identity"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120) as r:
                  return r.status, dict(r.headers), r.read()
          def shape(x, depth=0, maxd=4):
              p = "  " * depth
              if isinstance(x, dict):
                  for k, v in list(x.items())[:25]:
                      if isinstance(v, (dict, list)):
                          print(f"{p}{k}: {type(v).__name__}({len(v)})"); 
                          if depth < maxd: shape(v, depth + 1, maxd)
                      else:
                          print(f"{p}{k}: {json.dumps(v, ensure_ascii=False)[:120]}")
              elif isinstance(x, list) and x:
                  print(f"{p}[0] de {len(x)}:"); shape(x[0], depth + 1, maxd)
          for path in ["/data/tariffs.json", "/data/stations.json"]:
              try:
                  code, h, b = get("https://data.mobie.pt" + path)
              except Exception as e:
                  print(f"\n### {path}: ERRO {e}"); continue
              print(f"\n### {path}: {code} {h.get('Content-Type')} {len(b)} bytes · Last-Modified: {h.get('Last-Modified')} · ETag: {h.get('ETag')}")
              try:
                  d = json.loads(b)
              except Exception as e:
                  print("não é JSON:", e, b[:300]); continue
              shape(d)
              # amostra completa de um elemento com tarifas
              s = json.dumps(d, ensure_ascii=False)
              i = s.find('"tariff')
              print("\n   excerto:", s[max(0, i-300):i+1500] if i >= 0 else s[:1500])
          EOF
