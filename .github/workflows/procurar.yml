# TEMPORÁRIO: inspeciona os ficheiros de dados de data.mobie.pt (só escreve no registo).
name: Procurar link de tarifas (temporário)

on:
  workflow_dispatch:

jobs:
  procurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspecionar
        run: |
          python3 - <<'EOF'
          import json, urllib.request, collections as C
          get = lambda p: json.loads(urllib.request.urlopen(urllib.request.Request("https://data.mobie.pt" + p, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read())
          T = get("/data/tariffs.json"); S = get("/data/stations.json")
          st = S["stations"]
          byname = {s["name"]: s for s in st}; byid = {s["id"]: s for s in st}
          un = [n for n in T["stations"] if n not in byname]
          print("exemplos sem correspondência:", un[:25])
          print("estão no campo id?", sum(1 for n in un if n in byid))
          import re
          nn = [s for s in st if not s.get("name")]
          print("postos sem name:", len(nn), "exemplos:", [(s["id"], s.get("partyId"), [x["evse"] for x in s["sockets"]][:3]) for s in nn[:6]])
          pref = {}
          for s in st:
              for x in s["sockets"]:
                  m = re.match(r"^(.*?)[-.](\d+)$", x.get("evse") or "")
                  if m: pref.setdefault(m.group(1), s)
          print("correspondência pelo prefixo do evse:", sum(1 for n in T["stations"] if n in byname or n in pref), "de", len(T["stations"]))
          un2 = [n for n in T["stations"] if n not in byname and n not in pref]
          print("ainda sem correspondência:", len(un2), un2[:20])
          EOF
