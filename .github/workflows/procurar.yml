# TEMPORÁRIO: procura a API de dados usada pelo mapa data.mobie.pt (só escreve no registo).
name: Procurar link de tarifas (temporário)

on:
  workflow_dispatch:

jobs:
  procurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Procurar
        run: |
          python3 - <<'EOF'
          import re, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60) as r:
                      return r.geturl(), r.status, r.headers.get("Content-Type"), r.read()
              except Exception as e:
                  return u, None, f"ERRO {e}", b""
          base = "https://data.mobie.pt"
          _, _, _, b = get(base + "/mapas/encontrar-posto")
          t = b.decode("utf-8", "replace")
          scripts = sorted(set(re.findall(r'(/_next/static/[^"\'\s\\]+\.js)', t)))
          print("scripts:", len(scripts))
          found = set()
          for s in scripts:
              _, _, _, sb = get(base + s)
              st = sb.decode("utf-8", "replace")
              for m in re.findall(r'["\'`](/api/[^"\'`\s]{1,120}|https?://[a-z0-9.-]*mobie\.pt/[^"\'`\s]{1,120})["\'`]', st):
                  found.add(m)
              for m in re.finditer(r'.{0,120}(?:tariff|tarif|prices|/api/).{0,160}', st):
                  x = m.group(0)
                  if "fetch" in x or "/api/" in x:
                      print(f"[{s.rsplit('/',1)[-1]}] …", x[:300].replace("\n"," "))
          print("\nendpoints encontrados:")
          for f in sorted(found): print("  ", f)
          # tentar endpoints prováveis
          for f in sorted(found):
              if f.startswith("/api/") and "{" not in f and "$" not in f:
                  u, code, ct, body = get(base + f)
                  print(f"\nGET {f} -> {code} {ct} {len(body)} bytes")
                  print("   ", body[:600].decode("utf-8","replace").replace("\n"," "))
          EOF
