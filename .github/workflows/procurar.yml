# TEMPORÁRIO: inspeciona os ficheiros de dados de data.mobie.pt (só escreve no registo).
name: Procurar link de tarifas (temporário)

on:
  workflow_dispatch:

jobs:
  procurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspecionar
        run: |
          python3 - <<'EOF'
          import json, urllib.request, collections as C
          get = lambda p: json.loads(urllib.request.urlopen(urllib.request.Request("https://data.mobie.pt" + p, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read())
          T = get("/data/tariffs.json"); S = get("/data/stations.json")
          st = S["stations"]
          byname = {s["name"]: s for s in st}; byid = {s["id"]: s for s in st}
          un = [n for n in T["stations"] if n not in byname]
          print("exemplos sem correspondência:", un[:25])
          print("estão no campo id?", sum(1 for n in un if n in byid))
          import re
          pat = C.Counter(re.sub(r"\d", "9", n) for n in un); print("padrões:", pat.most_common(10))
          pat2 = C.Counter(re.sub(r"\d", "9", s["name"]) for s in st); print("padrões stations.json:", pat2.most_common(10))
          nt = set(T["stations"]); sem = [s["name"] for s in st if s["name"] not in nt and s.get("mobieNetwork")]
          print("postos MOBI.E sem tarifas:", len(sem), sem[:15])
          for n in un[:3]:
              cand = [s for s in st if n.split("-")[-1] in s["name"]][:3]
              print(n, "->", [(c["name"], c["id"], c["partyId"], c["municipality"]) for c in cand])
          EOF
